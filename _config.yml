markdown: kramdown
# No external theme — fully custom design
name: Deeplang.org
title: Deeplang.org
author: Deeplang
description: A memory-safe programming language for AIoT & edge AI devices.
show_downloads: false
github:
  repository_url: https://github.com/deeplang-org/deeplang
# No external plugins needed — zero-dependency design
# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      lang: en
  - scope:
      path: "zh"
    values:
      lang: zh
# Exclude from output
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
