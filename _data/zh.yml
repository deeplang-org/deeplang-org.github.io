  subtitle: "为 IoT 量身定制的轻量级虚拟机"
  description: "DeepVM 是驱动 DeepLang 在嵌入式设备上运行的虚拟机。它被设计得小巧、快速且可移植到各种微控制器架构。"
  specs:
    - label: "ROM 占用"
