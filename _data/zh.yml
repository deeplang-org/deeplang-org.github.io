about_page:
  title: "关于 DeepLang"
  intro: "DeepLang 是一种由来自浙大、中科大、帝国理工等高校学生共同开发的开源编程语言。我们致力于为 AIoT 和边缘 AI 时代构建一门安全、高效、开发者友好的语言。"
  origins: "起源"
  origins_text: "DeepLang 始于 2020 年，源于这样一个理念：AIoT 开发不应以牺牲安全性来换取性能。现有的编程语言要么需要庞大的运行时（Python、JavaScript），要么缺乏内存安全（C、C++），要么对资源受限的边缘设备过于复杂。DeepLang 以现代类型系统、内存安全保证和直接编译到 WebAssembly 填补了这一空白。"
  community: "社区"
  community_text: "我们的社区包括对编程语言、编译器、类型系统和边缘计算充满热情的学生、研究者和行业专业人士。我们定期举办技术讲座和研讨会，并积极开发编译器工具链。"
  repo: "源代码"

