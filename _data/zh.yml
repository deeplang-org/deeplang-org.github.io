hero:
  title: "DeepLang"
  subtitle: "面向 IoT 设备的内存安全编程语言"
  description: "DeepLang 是一种现代、内存安全的编程语言，专为资源受限的 IoT 环境设计。采用 C 风格语法、强静态类型系统和多范式支持，兼顾安全与性能。"
  github_button: "在 GitHub 上查看"
  learn_more: "了解更多"

features:
  title: "语言特性"
  subtitle: "为 IoT 开发而生，兼顾安全与生产力"
  items:
    - title: "内存安全"
      description: "借鉴 Rust 的所有权与借用检查机制，在编译期杜绝空指针解引用、缓冲区溢出和 use-after-free 等内存错误。"
      icon: "🛡️"
    - title: "强静态类型"
      description: "丰富的类型系统，支持代数数据类型（ADT）、模式匹配和类型推断，在早期捕获错误。"
      icon: "🔒"
    - title: "C 风格语法"
      description: "熟悉的 C/C++ 风格语法，容易上手。花括号、分号和熟悉的控制流结构。"
      icon: "📝"
    - title: "多范式编程"
      description: "同时支持过程式、面向对象（通过接口实现）和函数式编程范式，融于一体。"
      icon: "🧩"
    - title: "接口系统"
      description: "基于接口的静态分发多态——无虚表、无运行时开销。行为与数据的清晰分离。"
      icon: "🔌"
    - title: "模式匹配"
      description: "丰富的模式匹配系统，支持 ADT、元组、结构体和字面量的解构，编译期穷举性检查。"
      icon: "🎯"

