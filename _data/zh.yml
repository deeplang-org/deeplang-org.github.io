about_page:
  title: "关于 DeepLang"
  subtitle: "为边缘计算构建更安全、更智能的未来"
  mission:
    title: "我们的使命"
    text: "DeepLang 是一种由来自浙大、中科大、帝国理工等高校学生共同开发的开源编程语言。我们致力于为 AIoT 和边缘 AI 时代构建一门安全、高效、开发者友好的语言——将现代语言设计的安全保障带入资源受限的设备世界。"
  timeline:
    title: "项目历程"
    items:
      - year: "2020"
        title: "扬帆起航"
        desc: "DeepLang 项目正式启动。核心团队组建，语言规范初稿完成，DeepVM 设计开始。"
      - year: "2021"
        title: "社区成长"
        desc: "定期技术讲座开始。首届 Workshop 在杭州举办。编译器前端、类型系统和 ANF 转换实现。"
      - year: "2022"
        title: "编译器成熟"
        desc: "基于 OCaml 的类型系统和编译器流水线完成。WASM 代码生成实现。语言规范趋于稳定。"
      - year: "2024+"
        title: "AIoT 与边缘 AI"
        desc: "重点扩展至 AIoT 和边缘 AI 领域。持续进行编译器优化、更广泛的芯片支持和生态建设。"
  repos:
    title: "代码仓库"
    items:
      - name: "deeplang"
        desc: "主仓库——语言规范、DeepVM 运行时、文档和示例代码。"
        icon: "📦"
