deepvm:
  title: "DeepVM"
  subtitle: "A lightweight virtual machine purpose-built for IoT"
  description: "DeepVM is the runtime that powers DeepLang on embedded devices. It's designed to be small, fast, and portable across microcontroller architectures."
  specs:
    - label: "ROM Footprint"
      value: "≤ 100 KB"
    - label: "RAM Usage"
      value: "≤ 50 KB"
    - label: "WASM Support"
      value: "Yes"
    - label: "Interactive REPL"
      value: "Built-in"
  targets:
    title: "Supported Chips"
    items:
      - "Espressif ESP32"
      - "Huawei HI3861"
      - "Loongson 1C0300B"

