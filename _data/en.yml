about_page:
  title: "About DeepLang"
  intro: "DeepLang is an open-source programming language designed by students from ZJU, USTC, Imperial College London and other universities. We are building a safe, efficient, and developer-friendly language for the AIoT and edge AI era."
  origins: "Origins"
  origins_text: "Started in 2020, DeepLang was born from the idea that AIoT development shouldn't sacrifice safety for performance. Existing languages either require large runtimes (Python, JavaScript), lack memory safety (C, C++), or are too complex for resource-constrained edge devices. DeepLang fills this gap with a modern type system, memory safety guarantees, and direct compilation to WebAssembly."
  community: "Community"
  community_text: "Our community includes students, researchers, and industry professionals passionate about programming languages, compilers, type systems, and edge computing. We hold regular talks and workshops, and actively develop the compiler toolchain."
  repo: "Source Code"

