about_page:
  title: "About DeepLang"
  intro: "DeepLang is an open-source programming language designed by students from ZJU, USTC, Imperial College London and other universities. We are building a safe, efficient, and developer-friendly language for the IoT era."
  origins: "Origins"
  origins_text: "Started in 2020, DeepLang was born from the idea that IoT development shouldn't sacrifice safety for performance. Existing languages either require large runtimes (Python, JavaScript), lack memory safety (C, C++), or are too complex for constrained devices."
  community: "Community"
  community_text: "Our community includes students, researchers, and industry professionals passionate about programming languages, compilers, and embedded systems. We hold regular talks and workshops."
